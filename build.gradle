plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.github.node-gradle.node' version '7.0.1'
}

group = 'com'
version = '0.2.0'
sourceCompatibility = '21'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    // Core
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AI
    implementation 'com.google.genai:google-genai:1.41.0'

    // .env file support
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // Database
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Observability
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}
tasks.named('test') {
    useJUnitPlatform()
}

node {
    download = true                   // uses a local Node, no system deps
    version = '20.15.0'
    nodeProjectDir = file("$projectDir/frontend")
}

/** ---- UI build for production JAR ---- */
tasks.register('uiNpmInstall', com.github.gradle.node.npm.task.NpmInstallTask)

tasks.register('uiBuild', com.github.gradle.node.npm.task.NpmTask) {
    dependsOn 'uiNpmInstall'
    args = ['run', 'build']
}

tasks.register('copyUiToStatic', Copy) {
    dependsOn 'uiBuild'
    from("$projectDir/frontend/dist")
    into("$buildDir/resources/main/static")
}

processResources {
    dependsOn 'copyUiToStatic'
}